plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'jacoco'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

application {
    mainClassName = 'xeq.EquationExchangeTest'
}

javafx {
    version = "21"
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.2'
    // Mockito dependency for mocking
    testImplementation 'org.mockito:mockito-core:4.0.0'

    // Mockito Inline for static mocking (MockedStatic)
    testImplementation 'org.mockito:mockito-inline:4.0.0'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.9.2' // Use the latest version


    // Mockito JUnit Jupiter integration (if not using @RunWith)
    testImplementation 'org.mockito:mockito-junit-jupiter:4.0.0'
    testImplementation 'org.junit.platform:junit-platform-console-standalone:1.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-console-standalone:1.9.2'


    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'


    // This dependency is used by the application.
    implementation 'com.google.guava:guava:30.1.1-jre'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.9.2' // Use the latest version

    implementation 'org.openjfx:javafx-controls:21'
    implementation 'org.openjfx:javafx-fxml:21'
    implementation 'org.openjfx:javafx-base:21'
    implementation 'org.openjfx:javafx-controls:21'
    implementation 'org.openjfx:javafx-graphics:21'
    runtimeOnly 'org.openjfx:javafx-base:21'
    runtimeOnly 'org.openjfx:javafx-graphics:21'
    runtimeOnly 'org.openjfx:javafx-fxml:21'

}

jar {
    manifest {
        attributes(
                'Main-Class': 'xeq.EquationExchangeMain'  // Replace with your main class
        )
    }
}
run {
    // Add JavaFX modules explicitly
    jvmArgs = [
            '--module-path', 'src/main/resources/javafx-sdk-21.0.5/lib', // Replace with your JavaFX SDK path
            '--add-modules', 'javafx.controls,javafx.fxml'
    ]
}
sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}



tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
task buildJar(type: Jar) {
    from sourceSets.main.output
    manifest {
        attributes(
                'Main-Class': 'xeq.EquationExchangeMain'
        )
    }
}

//build.dependsOn buildJar