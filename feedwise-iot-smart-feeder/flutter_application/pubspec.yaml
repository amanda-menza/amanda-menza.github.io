name: flutter_application_dog_feeder
description: FeedWise mobile app for monitoring and controlling the smart feeder.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_setting_control: ^1.1.0
  http: ^1.2.2 # Make sure to use the latest version
  fl_chart: ^0.68.0
  shared_preferences: ^2.1.0

  english_words: ^4.0.0
  provider: ^6.0.0
  syncfusion_flutter_charts: ^27.1.58
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
